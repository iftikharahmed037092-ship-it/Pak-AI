<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PakAI — Chat</title>

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="chat.css">
</head>

<body>

    <!-- PAKAI BASIC CHAT SYSTEM -->

    <div class="chat-app">

        <!-- Header -->
        <header class="chat-header">

            <div class="header-left">
                <a href="index.html" class="back-button" aria-label="Home">
                    ←
                </a>

                <div class="mini-logo">P</div>

                <div class="brand-info">
                    <h1>PakAI</h1>
                    <span>AI Assistant</span>
                </div>
            </div>

            <div class="header-actions">

                <button
                    type="button"
                    id="newChatBtn"
                    class="header-button"
                    title="New Chat">
                    ＋
                </button>

                <button
                    type="button"
                    id="clearChatBtn"
                    class="header-button"
                    title="Clear Chat">
                    🗑️
                </button>

            </div>

        </header>


        <!-- Chat Messages -->
        <main
            id="chatMessages"
            class="chat-messages"
            aria-live="polite">

            <!-- Welcome Message -->
            <section class="welcome-message">

                <div class="welcome-logo">
                    P
                </div>

                <h2>السلام علیکم 👋</h2>

                <p>
                    میں PakAI ہوں۔ آپ مجھ سے کوئی بھی سوال پوچھ سکتے ہیں۔
                </p>

            </section>

        </main>


        <!-- Typing Indicator -->
        <div
            id="typingIndicator"
            class="typing-indicator hidden">

            <span></span>
            <span></span>
            <span></span>

            <label>PakAI سوچ رہا ہے...</label>

        </div>


        <!-- Message Composer -->
        <footer class="chat-composer">

            <form id="chatForm" class="message-form">

                <button
                    type="button"
                    id="attachBtn"
                    class="composer-button"
                    title="Attach">
                    📎
                </button>

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    maxlength="10000"
                    placeholder="اپنا سوال لکھیں..."
                    aria-label="Message"></textarea>

                <button
                    type="submit"
                    id="sendMessageBtn"
                    class="send-button"
                    title="Send">
                    ➤
                </button>

            </form>

            <p class="composer-note">
                PakAI غلطی کر سکتا ہے۔ اہم معلومات کو verify کریں۔
            </p>

        </footer>

    </div>


    <script src="app.js"></script>
    <script src="chat.js"></script>

</body>

</html>
